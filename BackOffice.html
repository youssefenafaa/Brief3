<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <!-- -- bootstrap CSS --  -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
   <link rel="stylesheet" href="BackOffice.css">
    <title>BackOffice</title>


</head>
<body>
        <HEader>
        <section class="paragraf1">
            <p> Du grain à votre tasse. Un café qui vous ressemble </p>
        </section>
        <section class="Header-principale">
            <div class="logo">
                <img src="/assets/Icon/Signature de marque.png" alt="">
            </div>
            <nav class="links">
                <a href="">L’atelier café</a>
                <a href="">Notre savoir-faire</a>
                <a href="">Besoin d’aide ?</a>

            </nav>
            <div class="Icon">
                <img src="/assets/Icon/Panier.png" alt="">


            </div>
        </section>
    </HEader>

    <main>


            <form action="">
       <section class="Info-General">
   <div class="title-section">
     <h3 class="display-6"> <strong>Information Generale</strong></h3>
   </div>
       
  <div class="form-row">
    <div class="col-md-4 mb-3">
      <label for="validationCustom01"><strong>Nom de la boisson</strong></label>
      <input type="text" class="form-control" id="validationCustom01" placeholder="Ex : espresso"  required>
    </div>
    <div class="form-group ">
      <label for="inputPrix"><strong>Prix de base</strong></label>
      <input type="number" class="form-control" id="inputPrix" placeholder="Prix">
    </div>
  </div>
     <div class="form-group">
    <label for="inputDescription "> <strong>Description</strong> </label>
    <input type="text" class="form-control" id="inputDescription" placeholder="Description ">
  </div>
  <div>
     <div class="form-group">
    <label for="inputUrl"> <strong>Image du produit</strong> </label>
    <input type="url" class="form-control" id="inputUrl" placeholder="Url ">
  </div>
  </div>

    <div class="form-group">
    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="gridCheck">
      <label class="form-check-label" for="gridCheck">
        <strong> Produit en promotion</strong> 
      </label>
    </div>
    

        <div class="form-group ">
      <label for="inputPorcentage"><strong>Apparition de Pourcentage de réduction</strong></label>
      <input type="number" class="form-control col-md-2" id="inputPorcentage" placeholder="Pourcentage">
    </div>
    <div>
      <label for="inputDate"><strong>Date de fin</strong></label>
      <input type="date" class="form-control col-md-2" id="inputDate" placeholder="Date de fin">
    </div>

  </div>
  <button type="submit" class="btn btn-primary">Next</button>

</section>



            </form>


    
        



    </main>


    <footer>
        <div class="foot">
            <p>
                BRUME - Le gout de votre rythme.
            </p>
            <p>
                une creation unique la votre
            </p>
        </div>
    </footer>




<script src="BackOffice.js"></script>
<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
</body>
</html>
