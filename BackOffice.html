            <form action="">
       <section class="Info-General " id="section1">
   <div class="title-section">
     <h3 class="display-6"> <strong>Information Generale</strong></h3>
   </div>
       
  <div class="form-row">
    <div class="col-md-4 mb-3">
      <label for="validationCustom01"><strong>Nom de la boisson</strong></label>
      <input type="text" class="form-control " id="validationCustom01"  placeholder="Ex : espresso"  required>
      <div class="nomChamp"> </div>
    </div>
    <div class="col-md-4 mb-3 ">
      <label for="inputPrix"><strong>Prix de base</strong></label>
      <input type="number" class="form-control inputPrice" id="inputPrix" placeholder="Prix">
      <div class="priceChamp"> </div>
    </div>
  </div>
     <div class="form-group">
    <label for="inputDescription "> <strong>Description</strong> </label>
    <input type="text" class="form-control" id="inputDescription" placeholder="Description ">
  </div>
  <div>
     <div class="form-group">
    <label for="inputUrl"> <strong>Image du produit</strong> </label>
    <input type="url" class="form-control" id="inputUrl" placeholder="Url ">
    <div class="urlChamp"></div>
  </div>
  </div>

    <div class="form-group">
    <div class="form-check">
      <input class="form-check-input InputPromotion"  type="checkbox" id="gridCheck">
      <label class="form-check-label" for="gridCheck">
           <strong> Produit en promotion</strong> 
      </label>
    </div>
    

        <div class="col-md-4 mb-3 hideen " id="divPorcentage" >
      <label for="inputPorcentage"><strong>Apparition de Pourcentage de réduction</strong></label>
      <input type="number" class="form-control col-md-2" id="inputPorcentage" placeholder="Pourcentage">
      <div class="PorcentageChamp"></div>
    </div>
    <div class="col-md-4 mb-3 hideen" id="DivDate">
      <label for="inputDate"><strong>Date de fin</strong></label>
      <input type="date" class="form-control col-md-2" id="inputDate" placeholder="Date de fin">
      <div class="DateChamp"></div>
    </div>

  </div>
  <button type="button" id="nextbtn" class="btn btn-primary">Next</button>

</section>
 
<section class="Info-General hideen " id="section2">
    <div class="title-section">
     <h3 class="display-6 "> <strong>Caractéristiques & Options</strong></h3>
   </div>
     <div class="col-md-4 mb-3">
    <select class="form-select ">
  <option value="titre" >Origine des grains </option>
  <option value="1">Colombie</option>
  <option value="2">Éthiopie</option>
  <option value="3">Brésil</option>
   <option value="4">Mélange Maison</option>

</select>
     </div>
     
     <div class="col-md-4 mb-3">
        <label for="customRange1"  >Niveau de torréfaction / Intensité  (de 1 a 10) </label>
        <input type="range"  id="customRange1" name="Intensité" min="0" max="10">
     </div>


     <div class="Temperature col-md-4 mb-3">
        
            <p>  <strong>Température</strong></p>
            
        
            <div class="form-check">
  <input class="form-check-input" type="radio" name="flexRadioDefault" id="flexRadioDefault1">
  <label class="form-check-label" for="flexRadioDefault1">
    Chaud
  </label>
</div>
<div class="form-check">
  <input class="form-check-input" type="radio" name="flexRadioDefault" id="flexRadioDefault2" checked>
  <label class="form-check-label" for="flexRadioDefault2">
    Glacé
  </label>
</div>
     </div>


     <div class="col-md-4 mb-3">
        <div>
            <p><strong>Tailles disponibles</strong></p>
        </div>
 <div class="btn-group backrondBut" role="group" aria-label="Basic checkbox toggle button group">

  <label class="btn btn-outline-primary" for="btncheck1">Small </label>

  <input type="checkbox" class="btn-check" id="btncheck2" autocomplete="off">

  <input type="checkbox" class="btn-check" id="btncheck3" autocomplete="off">
  <label class="btn btn-outline-primary" for="btncheck3">Large</label>
</div>
     </div>



       <div class="col-md-4 mb-3">

            <p><strong>  Options de lait</strong></p>
        </div>
 <div class="btn-group" role="group" aria-label="Basic checkbox toggle button group">

  <label class="btn btn-outline-primary" for="btncheck4">Vache </label>

  <input type="checkbox" class="btn-check" id="btncheck5" autocomplete="off">

  <input type="checkbox" class="btn-check" id="btncheck7" autocomplete="off">

</div>
     </div>




      <div class="col-md-4 mb-3">

        </div>
 <div class="btn-group" role="group" aria-label="Basic checkbox toggle button group">

  <label class="btn btn-outline-primary" for="btncheck8">Vanille </label>

  <input type="checkbox" class="btn-check" id="btncheck9" autocomplete="off">
  <label class="btn btn-outline-primary" for="btncheck9">Caramel</label>

  <input type="checkbox" class="btn-check" id="btncheck10" autocomplete="off">
  <label class="btn btn-outline-primary" for="btncheck10">Noisette</label>
</div>
     </div>

<div >
      <button type="button" id="btnReteurP1" class="btn btn-primary">Retour</button>
    <button type="button" id="btnEregister" class="btn btn-primary">Enregistrer</button>
